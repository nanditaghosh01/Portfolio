<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="wineGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#5d0018" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#2a000c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0c0b0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1820"/>
      <stop offset="45%" stop-color="#121015"/>
      <stop offset="100%" stop-color="#080709"/>
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d98d" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d29f22" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5d0018" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Master Gold Gradient for the N Monogram -->
    <linearGradient id="nStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2be"/>
      <stop offset="25%" stop-color="#e8bd4b"/>
      <stop offset="55%" stop-color="#d29f22"/>
      <stop offset="85%" stop-color="#b88316"/>
      <stop offset="100%" stop-color="#f3d078"/>
    </linearGradient>

    <!-- Subtle Inner Bevel / Highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow & Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#d29f22" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold/Wine Aura -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#wineGlow)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="3.5"/>
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Master Monogram N (ONLY the logo, completely clean and centered) -->
  <g filter="url(#goldGlow)">
    <path d="M 160 368 L 160 144 L 352 368 L 352 144" 
          fill="none" 
          stroke="url(#nStrokeGrad)" 
          stroke-width="66" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <path d="M 160 368 L 160 144 L 352 368 L 352 144" 
          fill="none" 
          stroke="url(#highlightGrad)" 
          stroke-width="50" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.45" />

    <!-- Subtle Luxury Diamond Accent -->
    <polygon points="352,78 359,85 352,92 345,85" fill="#f7d98d" opacity="0.9"/>
  </g>
</svg>